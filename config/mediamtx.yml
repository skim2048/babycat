###############################################
# @claude MediaMTX configuration for Babycat (streamer container).
###############################################

# @claude Log level.
logLevel: info

# @claude API server (the controller container configures the RTSP source at runtime).
api: yes
apiAddress: :9997

# @claude No authentication here by design (SDD §2.4 (2)): playback requests are
# @claude authenticated at the router; only the compose-internal network and the
# @claude WebRTC media port (8890/udp) can reach this container.
authInternalUsers:
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: api
      - action: publish
      - action: read
      - action: playback

# @claude RTSP server (internal: analyzer / recorder consume, source is pulled).
rtspAddress: :8554

# @claude SRT not used — avoids a port 8890 conflict.
srt: no

# @claude WebRTC server. Signaling (8889) is relayed by the router; only the
# @claude media/ICE port (8890/udp) is published to the host.
webrtcAddress: :8889
# @claude webrtcAdditionalHosts: extra host IPs/names to advertise as ICE candidates.
# @claude Containers cannot see the host NIC, so docker-compose injects
# @claude MTX_WEBRTCADDITIONALHOSTS=${HOST_IP} (from .env).
webrtcLocalUDPAddress: :8890

paths:
  live:
    # @claude Source is configured at runtime via API from the controller container.
    # @claude (Camera credentials are entered in the frontend; the controller sets them via the API.)
    # @claude Event clips are assembled by the recorder container from its own RTSP
    # @claude consumption — mediamtx segments are not used.
