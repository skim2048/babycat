name: babycat

# @claude Four component services (one per SRS component, SDD §2.4 (1)) plus
# @claude the gateway (TLS termination in front of the router).
# @claude Externally published ports: gateway 8000/tcp (HTTPS), streamer
# @claude 8189/udp only (single-entry decision, SDD §2.4 (2); SRS §4.5).

services:

  # TLS termination — serves the single entry point 8000 over HTTPS. At start the server
  # certificate is issued by itself with HOST_IP as the SAN (the private CA is created too if absent);
  # only the CA root (data/caddy/caddy/pki/authorities/local/root.crt) is installed once on clients.
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: babycat-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"  # single external entry point (IF-001) — relayed to router
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - HOST_IP=${HOST_IP:?required}  # source of the certificate SAN (connection address)
      - TLS_EXTRA_HOSTS=${TLS_EXTRA_HOSTS:-}  # additional addresses/hostnames to add to the SAN
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - router

  streamer:
    build:
      context: .
      dockerfile: docker/streamer/Dockerfile
    image: babycat-streamer
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Seoul}
      # Add HOST_IP from .env to the ICE candidates MediaMTX advertises so that
      # browser clients can reach the MediaMTX WebRTC stream.
      - MTX_WEBRTCADDITIONALHOSTS=${HOST_IP:?required}
    ports:
      - "8189:8189/udp"  # WebRTC Media/ICE — the only direct path (IF-003)
    volumes:
      - ./config:/config  # mediamtx.yml (config), cam_profile.json and cam_applied.json (owned by the companion process)

  router:
    build:
      context: .
      dockerfile: docker/router/Dockerfile
    image: babycat-router
    restart: unless-stopped
    # no external port — entry goes through gateway (TLS termination)
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - DB_PATH=/data/db/router.db
      - JWT_EXPIRY=${JWT_EXPIRY:-600}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-2592000}
      - DEFAULT_USER=${DEFAULT_USER:?required}
      - DEFAULT_PASS=${DEFAULT_PASS:?required}
      - CORS_EXTRA_ORIGINS=${CORS_EXTRA_ORIGINS:-}  # list of origins to additionally allow outside the private-network rule
      - STREAMER_URL=http://streamer:8080
      - ANALYZER_URL=http://analyzer:8080
      - RECORDER_URL=http://recorder:8080
      - STREAMER_HLS_URL=http://streamer:8888
      - STREAMER_WEBRTC_URL=http://streamer:8889
    volumes:
      - ./data/db/router:/data/db
    depends_on:
      - streamer
      - analyzer
      - recorder

  # Preflight check — runs before analyzer and recorder and verifies the host's hardware codec path
  # (L4T release, device nodes, NvSciIPC socket, NVIDIA GStreamer plugin).
  # On failure the two services do not start, and the cause is left in `docker compose logs preflight`.
  # It reuses the recorder image, so there is no separate build (docker/preflight/preflight.sh).
  preflight:
    image: babycat-recorder
    build:
      context: .
      dockerfile: docker/recorder/Dockerfile
    restart: "no"
    entrypoint: ["sh", "/preflight/preflight.sh"]
    environment:
      - GST_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/gstreamer-1.0
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu
    volumes:
      - ./docker/preflight/preflight.sh:/preflight/preflight.sh:ro
      - /etc/nv_tegra_release:/host/nv_tegra_release:ro
      - /dev:/host/dev:ro
      - /tmp:/host/tmp:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro

  analyzer:
    build:
      context: .
      dockerfile: docker/analyzer/Dockerfile
    image: babycat-analyzer
    restart: unless-stopped
    runtime: nvidia
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - MEDIAMTX_URL=rtsp://streamer:8554/live
      - RECORDER_URL=http://recorder:8080
      - STATE_PATH=/data/state/analyzer.json
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GST_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/gstreamer-1.0
      - LD_LIBRARY_PATH=/usr/local/lib/python3.10/dist-packages/tvm:/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu
      - VLM_MODELS=${VLM_MODELS:?required}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-32}
      # Lower bound (seconds) on the interval between inference starts. 0 follows the hardware's natural cadence (FR-058).
      - MIN_INFER_INTERVAL=${MIN_INFER_INTERVAL:-0}
      - TARGET_FPS=${TARGET_FPS:-1.0}
      - N_FRAMES=${N_FRAMES:-4}
      - VLM_LOAD_TIMEOUT=${VLM_LOAD_TIMEOUT:-1800}
      - VLM_INFER_TIMEOUT=${VLM_INFER_TIMEOUT:-120}
    group_add:
      - video
    devices:
      - /dev/v4l2-nvdec  # hardware video decoder (Orin).
      - /dev/nvmap            # GPU memory manager; required by nvv4l2decoder.
      - /dev/nvhost-ctrl-gpu  # GPU control device.
      - /dev/nvhost-gpu       # GPU channel device.
    volumes:
      - ./data/models:/data/models # NanoLLM model cache (MLC compilation output). Must stay inside the project tree for portability.
      - ./data/state/analyzer:/data/state
      # Mount the host's NVIDIA GStreamer plugins and tegra libraries. They cannot be installed at image build time.
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      - /tmp/nvscsock:/tmp/nvscsock # NvSciIPC daemon socket. Required by the NvMMLite hardware path; without it, the pipeline falls back to cuvidv4l2 and then fails with a CUDA_GPU_ID EINVAL error.
    ipc: host      # NvSciIPC uses POSIX shm/mqueue in the host IPC namespace.
    depends_on:
      preflight:
        condition: service_completed_successfully
      streamer:
        condition: service_started
      recorder:
        condition: service_started

  recorder:
    build:
      context: .
      dockerfile: docker/recorder/Dockerfile
    image: babycat-recorder
    restart: unless-stopped
    runtime: nvidia
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - MEDIAMTX_URL=rtsp://streamer:8554/live
      - DB_PATH=/data/db/recorder.db
      - CLIP_DIR=/data/clips
      - STATE_PATH=/data/state/recorder.json
      - TRIGGER_SEGMENT_DIR=/run/babycat-segments/live
      - TRIGGER_COOLDOWN=${TRIGGER_COOLDOWN:-30}
      - TRIGGER_CLIP_DUR=${TRIGGER_CLIP_DUR:-5}
      - TRIGGER_PRE_EVENT_SEC=${TRIGGER_PRE_EVENT_SEC:-2}
      - TRIGGER_POST_EVENT_SEC=${TRIGGER_POST_EVENT_SEC:-${TRIGGER_CLIP_DUR:-5}}  # follows TRIGGER_CLIP_DUR when unset.
      # Retention period (days) of the inference history. Rows beyond it are purged hourly.
      - INFERENCE_RETENTION_DAYS=${INFERENCE_RETENTION_DAYS:-90}
      - CLIP_MIN_FREE_MB=${CLIP_MIN_FREE_MB:-512}
      - CLIP_TARGET_FREE_MB=${CLIP_TARGET_FREE_MB:-1024}
      - RECORDER_ENCODE_BITRATE=${RECORDER_ENCODE_BITRATE:-4000000}
      - RECORDER_ENCODE_FPS=${RECORDER_ENCODE_FPS:-30}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GST_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/gstreamer-1.0
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu
    group_add:
      - video
    devices:
      - /dev/v4l2-nvdec  # hardware video decoder (Orin).
      - /dev/v4l2-nvenc  # hardware video encoder (segment re-encoding, SDD §2.4 (3)).
      - /dev/nvmap            # GPU memory manager; required by the nvv4l2 codec path.
      - /dev/nvhost-ctrl-gpu  # GPU control device.
      - /dev/nvhost-gpu       # GPU channel device.
    volumes:
      - ./data/clips:/data/clips
      - ./data/db/recorder:/data/db
      - ./data/state/recorder:/data/state
      # Mount the host's NVIDIA GStreamer plugins and tegra libraries.
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      - /tmp/nvscsock:/tmp/nvscsock
    tmpfs:
      - /run/babycat-segments:size=64m,mode=1777
    ipc: host
    depends_on:
      preflight:
        condition: service_completed_successfully
      streamer:
        condition: service_started
