name: babycat-web

services:

  web:
    image: babycat-web
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    ports:
      - "5173:5173"    # Vite development server.
    volumes:
      - .:/app         # Bind-mount web/ for HMR. node_modules stays under ./node_modules on the host.
